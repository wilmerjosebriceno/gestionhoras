<div class="min-h-screen bg-gray-50 p-6">
  <div class="max-w-4xl mx-auto">
    <div class="flex items-center gap-3 mb-8">
      <a href="javascript:void(0)" (click)="volver()" class="text-gray-500 hover:text-gray-800 text-sm transition-colors">← Volver a módulos</a>
    </div>

    <div class="bg-white rounded-xl border border-gray-200 overflow-hidden text-center">
      <div *ngIf="error" class="p-10 text-center">
        <p class="text-red-700 text-sm mb-2">{{ error }}</p>
        <button (click)="volver()" class="px-6 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-lg text-sm transition-colors">Volver a módulos</button>
      </div>
      <div *ngIf="!cargando && !error" class="p-10">
        <div class="h-28 flex items-center justify-center mb-6">
          <img [src]="icono" alt="{{ denominacion }}" class="h-24 w-24 object-contain" />
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">{{ denominacion }}</h1>
        <p class="text-gray-500 mb-2">Módulo <span class="text-blue-600">{{ modulo }}</span></p>
        <div class="p-4 bg-yellow-100 border border-yellow-700 rounded-lg text-yellow-300 text-sm mt-6">
          Este módulo está en construcción. Próximamente se habilitarán sus funcionalidades.
        </div>
        <button
          (click)="volver()"
          class="mt-8 px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm transition-colors"
        >Ir a Módulos</button>
      </div>
      <div *ngIf="cargando" class="p-16 text-gray-500">Cargando módulo...</div>
    </div>
  </div>
</div>
