<div class="min-h-screen bg-gray-50 p-6">
  <div class="max-w-7xl mx-auto">
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-gray-800">SIGESP SISTEMAS</h1>
      <p class="text-gray-500 text-sm mt-1">Seleccione el módulo al que desea ingresar</p>
    </div>

    <div *ngIf="loading" class="text-center py-16 text-gray-500">Cargando módulos...</div>

    <div *ngIf="error" class="p-4 mb-6 bg-red-100 border border-red-700 rounded-lg text-red-700 text-sm text-center">
      <div class="mb-2 font-medium">No se pudieron cargar los módulos</div>
      <div>{{ error }}</div>
      <button (click)="cargar()" class="mt-3 px-4 py-1.5 text-sm bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-lg transition-colors">Reintentar</button>
    </div>

    <div *ngIf="!loading && !error" class="flex flex-wrap justify-center gap-6">
      <div
        *ngFor="let m of modulos"
        class="w-full sm:w-80 bg-white rounded-xl overflow-hidden border border-gray-200 hover:border-blue-500 transition-all transform hover:-translate-y-1 cursor-pointer"
        (click)="ir(m)"
      >
        <div class="h-40 flex items-center justify-center bg-gray-50">
          <img [src]="icono(m)" alt="{{ m.denominacion }}" class="h-24 w-24 object-contain" />
        </div>
        <div class="p-5 flex flex-col items-center text-center">
          <h2 class="text-lg font-bold text-gray-800 mb-1">{{ m.denominacion }}</h2>
          <p class="text-gray-500 text-sm flex-grow mb-4">{{ m.descripcion }}</p>
          <a
            href="javascript:void(0)"
            class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm transition-colors"
            (click)="ir(m)"
          >Ir a Módulo</a>
        </div>
      </div>
    </div>

    <div *ngIf="!loading && !error && modulos.length === 0" class="text-center text-gray-500 py-16">
      No hay módulos registrados
    </div>
  </div>
</div>
