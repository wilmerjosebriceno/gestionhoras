<div class="space-y-6">
  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-bold text-gray-800">Sistemas</h1>
    <a routerLink="/sec/sistemas/nuevo" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm transition-colors">Nuevo Sistema</a>
  </div>

  <div class="bg-white rounded-xl overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-gray-100">
        <tr>
          <th class="px-4 py-3 text-left text-gray-600 font-medium">Codigo</th>
          <th class="px-4 py-3 text-left text-gray-600 font-medium">Denominacion</th>
          <th class="px-4 py-3 text-left text-gray-600 font-medium">Ruta</th>
          <th class="px-4 py-3 text-left text-gray-600 font-medium">Estatus</th>
          <th class="px-4 py-3 text-right text-gray-600 font-medium">Acciones</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        <tr *ngIf="loading && sistemas.length === 0">
          <td colspan="5" class="px-4 py-8 text-center text-gray-500">Cargando...</td>
        </tr>
        <tr *ngFor="let s of sistemas" class="hover:bg-gray-100 transition-colors">
          <td class="px-4 py-3 text-gray-800">{{ s.sistema }}</td>
          <td class="px-4 py-3 text-gray-600">{{ s.denominacion }}</td>
          <td class="px-4 py-3 text-gray-600">{{ s.ruta }}</td>
          <td class="px-4 py-3">
            <span [class]="s.estatus === 1 ? 'px-2 py-1 text-xs rounded-full bg-green-100 text-green-700' : 'px-2 py-1 text-xs rounded-full bg-red-100 text-red-700'">
              {{ s.estatus === 1 ? 'Activo' : 'Inactivo' }}
            </span>
          </td>
          <td class="px-4 py-3 text-right space-x-2">
            <a [routerLink]="['/sec/sistemas', s.sistema]" class="text-blue-600 hover:text-blue-700">Editar</a>
            <button (click)="eliminar(s)" class="text-red-600 hover:text-red-700">Eliminar</button>
          </td>
        </tr>
        <tr *ngIf="!loading && sistemas.length === 0">
          <td colspan="5" class="px-4 py-8 text-center text-gray-500">No hay sistemas registrados</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="error" class="p-3 bg-red-100 border border-red-700 rounded-lg text-red-700 text-sm">{{ error }}</div>
</div>
