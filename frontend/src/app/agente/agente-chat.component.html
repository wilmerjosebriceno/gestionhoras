<div class="fixed bottom-5 right-5 z-50 flex flex-col items-end">
  <div
    *ngIf="abierto"
    class="mb-3 w-[22rem] sm:w-[26rem] h-[32rem] max-h-[80vh] bg-white rounded-2xl shadow-2xl border border-gray-200 flex flex-col overflow-hidden"
  >
    <header class="flex items-center justify-between px-4 py-3 bg-blue-700 text-white">
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 00-6.23.693L5 14.5m14.8.8l1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0112 21c-2.773 0-5.491-.235-8.135-.687-1.718-.293-2.3-2.379-1.067-3.61L5 14.5"/>
        </svg>
        <span class="font-semibold text-sm">Asistente IA</span>
      </div>
      <div class="flex items-center gap-1">
        <button (click)="limpiar()" title="Nueva conversación" class="p-1.5 hover:bg-blue-600 rounded-lg transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>
        <button (click)="toggle()" title="Cerrar" class="p-1.5 hover:bg-blue-600 rounded-lg transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
    </header>

    <div #scroll class="flex-1 overflow-y-auto px-3 py-3 space-y-3 bg-gray-50">
      <div
        *ngIf="configurado === false"
        class="text-center text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-3"
      >
        El asistente no está configurado. Defina <code class="font-mono">AGENTE_API_KEY</code> en el backend.
      </div>

      <div *ngFor="let m of mensajes" class="flex" [class.justify-end]="m.rol === 'user'">
        <div
          [ngClass]="{
            'bg-blue-600 text-white rounded-br-sm': m.rol === 'user',
            'bg-white text-gray-800 border border-gray-200 rounded-bl-sm': m.rol === 'assistant',
            'bg-red-50 text-red-700 border border-red-200': m.rol === 'error'
          }"
          class="max-w-[85%] px-3 py-2 rounded-2xl text-sm whitespace-pre-wrap break-words"
        >
          {{ m.texto }}
          <div *ngIf="m.herramientas?.length" class="mt-1 text-[10px] opacity-70">
            Consultó: {{ m.herramientas?.join(', ') }}
          </div>
        </div>
      </div>

      <div *ngIf="enviando" class="flex">
        <div class="bg-white border border-gray-200 rounded-2xl rounded-bl-sm px-3 py-2 text-sm text-gray-400">
          Escribiendo…
        </div>
      </div>
    </div>

    <div class="border-t border-gray-200 p-3 bg-white">
      <div class="flex items-end gap-2">
        <textarea
          [(ngModel)]="borrador"
          (keydown)="onEnter($event)"
          rows="1"
          placeholder="Escribe tu consulta…"
          [disabled]="enviando || configurado === false"
          class="flex-1 resize-none px-3 py-2 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100"
        ></textarea>
        <button
          (click)="enviar()"
          [disabled]="enviando || !borrador.trim() || configurado === false"
          class="px-3 py-2 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 text-white rounded-xl text-sm transition-colors"
        >
          Enviar
        </button>
      </div>
    </div>
  </div>

  <button
    (click)="toggle()"
    class="flex items-center justify-center w-14 h-14 rounded-full bg-blue-600 hover:bg-blue-700 text-white shadow-lg transition-colors"
    title="Asistente IA"
  >
    <svg *ngIf="!abierto" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
    </svg>
    <svg *ngIf="abierto" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
    </svg>
  </button>
</div>
