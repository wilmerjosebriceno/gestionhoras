<div class="bg-white rounded-xl border border-gray-200 p-4">
  <div *ngIf="cargando" class="p-6 text-center text-gray-400 text-sm">Cargando Gantt…</div>

  <div *ngIf="!cargando">
    <div *ngIf="!filas.length" class="p-6 text-center text-gray-400 text-sm">
      Sin actividades con fechas. Agrega actividades con fecha de inicio y fin.
    </div>

    <div *ngIf="filas.length" class="flex">
      <!-- Columna de actividades -->
      <div class="w-64 shrink-0 border-r border-gray-200">
        <div class="h-8 flex items-center px-2 text-xs font-semibold text-gray-500 bg-gray-50 border-b border-gray-200">
          Actividad
        </div>
        <div *ngFor="let f of filas" class="h-9 flex items-center gap-1 px-2 text-xs text-gray-700 border-b border-gray-100 truncate"
             [title]="f.nombre">
          <span class="truncate" [style.padding-left.px]="f._nivel * 14">
            <span *ngIf="f.tipo === 'resumen'" class="mr-1">📁</span>
            <span *ngIf="f.tipo === 'hito'" class="mr-1">◆</span>
            <span *ngIf="f.codigo_wbs" class="font-mono text-gray-400">{{ f.codigo_wbs }}</span>
            <span [class.font-semibold]="f.tipo === 'resumen'">{{ f.nombre }}</span>
          </span>
        </div>
      </div>

      <!-- Línea de tiempo -->
      <div class="overflow-x-auto flex-1">
        <div [style.width.px]="anchoTotal()">
          <!-- Cabecera de días -->
          <div class="relative h-8 border-b border-gray-200 bg-gray-50">
            <div *ngFor="let t of ticks()"
                 class="absolute top-0 h-8 text-[10px] text-gray-500 border-l border-gray-200"
                 [style.left.px]="t.left" [style.width.px]="dayWidth"
                 [class.bg-gray-100]="t.finDeSemana"
                 [class.font-bold]="t.mes">
              <span class="pl-0.5">{{ t.label }}</span>
            </div>
          </div>

          <!-- Filas -->
          <div class="relative">
            <!-- Sombreado de fines de semana y línea de hoy -->
            <div class="absolute inset-0 pointer-events-none">
              <div *ngFor="let t of ticks()" class="absolute top-0 bottom-0"
                   [style.left.px]="t.left" [style.width.px]="dayWidth"
                   [class.bg-gray-50]="t.finDeSemana"></div>
              <div *ngIf="hoyOffset >= 0" class="absolute top-0 bottom-0 w-px bg-red-500"
                   [style.left.px]="hoyOffset * dayWidth + dayWidth / 2"></div>
            </div>

            <div *ngFor="let f of filas" class="relative h-9 border-b border-gray-100">
              <!-- Linea base -->
              <div *ngIf="f._leftBase != null" class="absolute top-1 h-2 rounded bg-gray-300"
                   [style.left.px]="f._leftBase" [style.width.px]="f._widthBase"
                   [title]="'Línea base: ' + (f.fecha_ini_base | date:'dd/MM') + ' - ' + (f.fecha_fin_base | date:'dd/MM')"></div>
              <!-- Hito -->
              <div *ngIf="f._esHito" class="absolute top-1/2 -translate-y-1/2 w-3 h-3 rotate-45 bg-purple-600"
                   [style.left.px]="f._left" [title]="f.nombre"></div>
              <!-- Barra -->
              <div *ngIf="!f._esHito" class="absolute top-3 h-5 rounded shadow-sm overflow-hidden"
                   [style.left.px]="f._left" [style.width.px]="f._width"
                   [style.background]="colorEstado(f.estado)"
                   [title]="f.nombre + ' (' + f.estado + ') · ' + f.avance_pct + '%'">
                <div class="h-full bg-black/20" [style.width.%]="f.avance_pct"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Leyenda -->
    <div *ngIf="filas.length" class="flex flex-wrap items-center gap-4 mt-4 text-xs text-gray-600">
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-slate-400"></span> Pendiente</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-blue-500"></span> En proceso</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-red-500"></span> Bloqueada</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-emerald-500"></span> Completada</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rotate-45 bg-purple-600"></span> Hito</span>
      <span class="flex items-center gap-1"><span class="w-3 h-1.5 rounded bg-gray-300"></span> Línea base</span>
      <span class="flex items-center gap-1"><span class="w-px h-3 bg-red-500"></span> Hoy</span>
    </div>
  </div>
</div>
