<div class="max-w-lg mx-auto">
  <h1 class="text-2xl font-bold text-gray-800 mb-1">Cambio de Contraseña</h1>
  <p class="text-sm text-gray-500 mb-6">Actualice su clave de acceso. Debe tener al menos 8 caracteres e incluir mayúscula, minúscula y número.</p>

  <form (ngSubmit)="guardar()" class="bg-white rounded-xl p-6 border border-gray-200 space-y-4">
    <div>
      <label class="block text-sm text-gray-600 mb-1">Contraseña actual *</label>
      <input type="password" [(ngModel)]="passwordActual" name="pa" required
        class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-sm" />
    </div>
    <div>
      <label class="block text-sm text-gray-600 mb-1">Nueva contraseña *</label>
      <input type="password" [(ngModel)]="passwordNuevo" name="pn" required minlength="8"
        class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-sm" />
      <p class="text-xs text-gray-400 mt-1">Mínimo 8 caracteres, con mayúscula, minúscula y número.</p>
    </div>
    <div>
      <label class="block text-sm text-gray-600 mb-1">Confirmar nueva contraseña *</label>
      <input type="password" [(ngModel)]="passwordConfirmacion" name="pc" required minlength="8"
        class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-sm" />
    </div>

    <div class="flex justify-end space-x-3 pt-2">
      <a routerLink="/" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg text-sm">Cancelar</a>
      <button type="submit" [disabled]="loading"
        class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm disabled:opacity-50">
        {{ loading ? 'Guardando...' : 'Cambiar contraseña' }}
      </button>
    </div>
  </form>
</div>
