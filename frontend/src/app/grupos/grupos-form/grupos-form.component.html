<div class="max-w-lg mx-auto space-y-6">
  <h1 class="text-2xl font-bold text-gray-800">{{ editando ? 'Editar' : 'Nuevo' }} Grupo</h1>

  <form (ngSubmit)="guardar()" class="bg-white rounded-xl p-6 space-y-4">
    <div>
      <label class="block text-sm text-gray-600 mb-1">Nombre del grupo *</label>
      <input [(ngModel)]="dto.grupo" name="grupo" required class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-sm" [readonly]="editando" />
    </div>
    <div>
      <label class="block text-sm text-gray-600 mb-1">Denominación *</label>
      <input [(ngModel)]="dto.denominacion" name="denominacion" required class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-sm" />
    </div>

    <div *ngIf="editando" class="border-t border-gray-200 pt-4">
      <label class="block text-sm text-gray-600 mb-2">Asignar usuarios al grupo</label>
      <div class="flex space-x-2">
        <input #loginInput placeholder="Login del usuario" class="flex-1 px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-sm" />
        <button type="button" (click)="agregarUsuario(loginInput.value); loginInput.value=''" class="px-3 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm">Agregar</button>
      </div>
      <div *ngIf="usuarios.length" class="mt-2 space-y-1">
        <div *ngFor="let u of usuarios" class="flex items-center justify-between px-3 py-1.5 bg-gray-100 rounded-lg text-sm">
          <span class="text-gray-600">{{ u }}</span>
          <button type="button" (click)="quitarUsuario(u)" class="text-red-600 hover:text-red-700">x</button>
        </div>
        <button type="button" (click)="asignarUsuarios()" class="mt-2 px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm">Guardar asignaciones</button>
      </div>
    </div>

    <div *ngIf="error" class="p-3 bg-red-100 border border-red-700 rounded-lg text-red-700 text-sm">{{ error }}</div>

    <div class="flex justify-end space-x-3">
      <a routerLink="/sec/grupos" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg transition-colors">Cancelar</a>
      <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors">
        {{ editando ? 'Actualizar' : 'Crear' }}
      </button>
    </div>
  </form>
</div>
<app-spinner [visible]="loading" message="Guardando grupo..."></app-spinner>
