<app-spinner [visible]="loading" message="Iniciando sesion..."></app-spinner>
<div class="min-h-screen flex items-center justify-center bg-cover bg-center" style="background-image: url('/icons/fondo.jpeg'); background-color: #eef2f7;">
  <div class="w-full max-w-md p-8 bg-white rounded-xl shadow-2xl">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">SIGESP</h1>
      <p class="text-gray-500 mt-2">Sistema Integrado de Gestión</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Usuario</label>
        <input
          type="text"
          [(ngModel)]="login.login"
          name="login"
          required
          class="w-full px-4 py-2.5 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
          placeholder="Ingrese su usuario"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Contraseña</label>
        <input
          type="password"
          [(ngModel)]="login.password"
          name="password"
          required
          class="w-full px-4 py-2.5 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
          placeholder="Ingrese su contraseña"
        />
      </div>

      <div *ngIf="error" class="p-3 bg-red-100 border border-red-700 rounded-lg text-red-700 text-sm">
        {{ error }}
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
