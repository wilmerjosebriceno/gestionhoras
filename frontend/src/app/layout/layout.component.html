<div class="min-h-screen bg-gray-50">
  <nav class="bg-white border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-4">
          <span class="text-xl font-bold text-gray-800">SIGESP</span>
          <a routerLink="/" class="text-gray-500 hover:text-gray-800 text-sm transition-colors">← Módulos</a>
          <span class="text-gray-500 text-sm">| {{ titulo }}</span>
        </div>
        <div class="flex items-center space-x-4">
          <button (click)="abrirAyuda()" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm bg-gray-50 hover:bg-gray-100 text-gray-600 rounded-lg transition-colors" title="Ayuda en línea">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            Ayuda
          </button>
          <a routerLink="/sec/cambio-password" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm bg-gray-50 hover:bg-gray-100 text-gray-600 rounded-lg transition-colors" title="Cambiar contraseña">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
            Contraseña
          </a>
          <span class="text-gray-600 text-sm">{{ usuario?.nombres }} {{ usuario?.apellidos }}</span>
          <button (click)="logout()" class="px-3 py-1.5 text-sm bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg transition-colors">
            Salir
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="flex">
    <aside *ngIf="!esDashboard && menu" class="w-72 bg-white min-h-[calc(100vh-4rem)] border-r border-gray-200 overflow-y-auto">
      <nav class="p-4 space-y-4">
        <div *ngFor="let grupo of menu.grupos">
          <div class="px-4 pt-2 pb-1 text-xs font-semibold text-gray-500 uppercase tracking-wider">{{ grupo.label }}</div>
          <div class="space-y-1">
            <a
              *ngFor="let item of grupo.items"
              [routerLink]="item.route || null"
              routerLinkActive="bg-blue-100 text-blue-700 font-medium"
              [href]="item.url || null"
              [attr.target]="item.url ? '_blank' : null"
              class="block px-4 py-2 rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition-colors text-sm"
            >
              {{ item.label }}
            </a>
          </div>
        </div>
      </nav>
    </aside>

    <main class="flex-1 p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<app-help-panel
  [visible]="helpVisible"
  [sistema]="helpSistema"
  [pagina]="helpPagina"
  [titulo]="helpTitulo"
  (close)="cerrarAyuda()"
></app-help-panel>

<app-agente-chat></app-agente-chat>
