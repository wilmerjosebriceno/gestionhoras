<div class="max-w-6xl mx-auto space-y-6">
  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-bold text-gray-800">
      {{ editando ? 'Actividad ' + header.numdoc : 'Nueva Actividad / Horas' }}
    </h1>
    <a routerLink="/sgh/actividades" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg text-sm">Volver</a>
  </div>

  <form (ngSubmit)="guardar()" class="space-y-4">
    <app-cliente-picker [seleccionado]="clienteSeleccionado" (seleccion)="onClienteSeleccionado($event)"></app-cliente-picker>

    <div class="bg-white rounded-xl p-4 space-y-4">
      <h2 class="text-sm font-semibold text-gray-600 uppercase tracking-wide">Datos de la Actividad</h2>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-sm text-gray-600 mb-1">Nro. Documento</label>
          <input [value]="header.numdoc" readonly disabled
            class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-gray-500 text-sm" />
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Tipo</label>
          <select [(ngModel)]="header.idType" name="idType"
            class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-sm">
            <option [ngValue]="undefined">Seleccione...</option>
            <option *ngFor="let t of tipos" [ngValue]="t.idType">{{ t.nameType }}</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Fecha Documento *</label>
          <input type="date" [(ngModel)]="header.dateDocument" name="dateDocument" required
            class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-sm" />
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Usuario</label>
          <input [value]="usuarioActual?.nameUser ?? ''" readonly disabled
            class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-gray-500 text-sm" />
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Proyecto</label>
          <select [(ngModel)]="header.idProyect" name="idProyect"
            class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-sm">
            <option [ngValue]="undefined">Sin proyecto</option>
            <option *ngFor="let p of proyectos" [ngValue]="p.idProyect">
              {{ p.numdoc }} — {{ p.dateProyect | date:'shortDate' }}
            </option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Responsable *</label>
          <input [(ngModel)]="header.responsible" name="responsible" required maxlength="250"
            class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-sm" />
        </div>
        <div class="flex items-end">
          <button type="button" (click)="header.visit = header.visit ? 0 : 1"
            class="flex items-center gap-2 text-sm text-gray-600">
            <span [class]="header.visit ? 'bg-green-600' : 'bg-gray-200'"
              class="w-9 h-5 rounded-full relative transition-colors">
              <span [class]="header.visit ? 'translate-x-5' : 'translate-x-0'"
                class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full transition-transform"></span>
            </span>
            Visita
          </button>
        </div>
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1">Nota</label>
        <textarea [(ngModel)]="header.note" name="note" rows="2"
          class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-sm"></textarea>
      </div>
    </div>

    <app-detalle-horas [items]="items" [filas]="detalles" [cargarProcesos]="cargarProcesos.bind(this)">
    </app-detalle-horas>

    <div *ngIf="errosDetalle.length" class="p-3 bg-amber-100 border border-amber-700 rounded-lg text-amber-700 text-sm">
      <ul class="list-disc pl-5 space-y-1">
        <li *ngFor="let e of errosDetalle">{{ e }}</li>
      </ul>
    </div>
    <div *ngIf="error" class="p-3 bg-red-100 border border-red-700 rounded-lg text-red-700 text-sm">{{ error }}</div>

    <div class="flex justify-end space-x-3">
      <a routerLink="/sgh/actividades"
        class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg transition-colors">Cancelar</a>
      <button type="button" *ngIf="editando" (click)="imprimir()"
        class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg transition-colors">Imprimir formato</button>
      <button type="submit" [disabled]="loading"
        class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors disabled:opacity-50">
        {{ loading ? 'Guardando...' : (editando ? 'Actualizar' : 'Crear') }}
      </button>
    </div>
  </form>
</div>
