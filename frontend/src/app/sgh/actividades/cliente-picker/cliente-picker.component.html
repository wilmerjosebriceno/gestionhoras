<div class="bg-white rounded-xl p-4 space-y-3">
  <div class="flex items-center justify-between">
    <h3 class="text-sm font-semibold text-gray-600">Selección de Cliente</h3>
    <span *ngIf="seleccionado"
      class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-green-100 text-green-700 text-xs">
      <span class="font-mono">{{ seleccionado.rif }}</span>
      <span>{{ seleccionado.name }}</span>
      <button type="button" (click)="limpiar()" class="hover:text-red-700" title="Cambiar cliente">✕</button>
    </span>
  </div>

  <div *ngIf="!seleccionado" class="flex flex-wrap gap-3 items-end">
    <div>
      <label class="block text-xs text-gray-500 mb-1">RIF</label>
      <input [(ngModel)]="rif" name="rifSearch" maxlength="10"
        class="px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-sm" />
    </div>
    <div>
      <label class="block text-xs text-gray-500 mb-1">Nombre</label>
      <input [(ngModel)]="nombre" name="nombreSearch"
        class="px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-sm w-72" />
    </div>
    <button type="button" (click)="buscar()" [disabled]="buscando"
      class="px-4 py-2 bg-green-700 hover:bg-green-600 text-white rounded-lg text-sm disabled:opacity-50">
      {{ buscando ? 'Buscando...' : 'Buscar' }}
    </button>
  </div>

  <div *ngIf="resultados.length" class="overflow-x-auto border border-gray-200 rounded-lg">
    <table class="w-full text-sm">
      <thead class="bg-gray-100">
        <tr>
          <th class="px-3 py-2 text-left text-gray-600 font-medium">RIF</th>
          <th class="px-3 py-2 text-left text-gray-600 font-medium">Razón Social</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        <tr *ngFor="let c of resultados" (click)="elegir(c)" class="cursor-pointer hover:bg-gray-100">
          <td class="px-3 py-2 font-mono text-blue-600">{{ c.rif }}</td>
          <td class="px-3 py-2 text-gray-600">{{ c.name }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
