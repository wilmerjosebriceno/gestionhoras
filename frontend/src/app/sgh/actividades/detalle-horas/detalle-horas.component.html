<div class="bg-white rounded-xl p-4 space-y-3">
  <div class="flex items-center justify-between">
    <h3 class="text-sm font-semibold text-gray-600">Detalle de Actividades / Horas</h3>
    <button type="button" (click)="agregarFila()"
      class="px-3 py-1 bg-green-700 hover:bg-green-600 text-white rounded-lg text-xs transition-colors">
      + Agregar fila
    </button>
  </div>

  <div class="overflow-x-auto border border-gray-200 rounded-lg">
    <table class="w-full text-sm">
      <thead class="bg-gray-100">
        <tr>
          <th class="px-3 py-2 text-left text-gray-600 font-medium">Actividad / Proyecto</th>
          <th class="px-3 py-2 text-left text-gray-600 font-medium">Módulo / Proceso</th>
          <th class="px-3 py-2 text-left text-gray-600 font-medium">Situación</th>
          <th class="px-3 py-2 text-center text-gray-600 font-medium">Horas</th>
          <th class="px-3 py-2 text-left text-gray-600 font-medium">Nota</th>
          <th class="px-3 py-2 text-left text-gray-600 font-medium"># Mantis</th>
          <th class="px-3 py-2 text-center text-gray-600 font-medium">Online</th>
          <th class="px-3 py-2"></th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        <tr *ngFor="let fila of filas; let i = index">
          <td class="px-3 py-2">
            <select [ngModel]="fila.idItemActivity" name="item{{ i }}"
              (ngModelChange)="onItemChange(fila, $event)"
              class="px-2 py-1 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-xs w-44">
              <option [ngValue]="undefined">Seleccione...</option>
              <option *ngFor="let it of items" [ngValue]="it.idItemActivity">{{ it.name }}</option>
            </select>
          </td>
          <td class="px-3 py-2">
            <select [ngModel]="fila.idProcess" name="proc{{ i }}"
              (ngModelChange)="fila.idProcess = $event"
              [disabled]="(!fila._opcionesProceso) || !!fila._cargando"
              class="px-2 py-1 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-xs w-44 disabled:opacity-50">
              <option [ngValue]="undefined">{{ fila._cargando ? 'Cargando...' : 'Seleccione proceso' }}</option>
              <option *ngFor="let p of fila._opcionesProceso" [ngValue]="p.idProcess">{{ p.nameProcess }}</option>
            </select>
          </td>
          <td class="px-3 py-2">
            <input [ngModel]="fila.situation" name="sit{{ i }}" (ngModelChange)="fila.situation = $event"
              readonly placeholder="Click para editar"
              (click)="editarTexto('situation', fila)"
              class="px-2 py-1 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-xs w-32 cursor-pointer hover:bg-gray-200" />
          </td>
          <td class="px-3 py-2 text-center">
            <input type="number" step="0.01" min="0.01" [ngModel]="fila.hours" name="hrs{{ i }}"
              (ngModelChange)="fila.hours = $event"
              class="w-20 px-2 py-1 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-xs text-right" />
          </td>
          <td class="px-3 py-2">
            <input [ngModel]="fila.note" name="dnota{{ i }}" (ngModelChange)="fila.note = $event"
              readonly placeholder="Click para editar"
              (click)="editarTexto('note', fila)"
              class="px-2 py-1 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-xs w-40 cursor-pointer hover:bg-gray-200" />
          </td>
          <td class="px-3 py-2">
            <input [ngModel]="fila.mantis" name="mantis{{ i }}" (ngModelChange)="fila.mantis = $event" maxlength="20"
              class="px-2 py-1 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-xs w-20" />
          </td>
          <td class="px-3 py-2 text-center">
            <input type="checkbox" [ngModel]="fila.online === 1" name="online{{ i }}"
              (ngModelChange)="fila.online = $event ? 1 : 0"
              title="Marcar si la actividad se realizó en modalidad ONLINE"
              class="w-4 h-4 accent-blue-600" />
          </td>
          <td class="px-3 py-2 text-right">
            <button type="button" (click)="quitarFila(i)" class="text-red-600 hover:text-red-700 text-xs">Eliminar</button>
          </td>
        </tr>
        <tr *ngIf="filas.length === 0">
          <td colspan="8" class="px-3 py-4 text-center text-gray-500">Sin actividades en el detalle.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
