<div class="max-w-4xl mx-auto space-y-6">
  <h1 class="text-2xl font-bold text-gray-800">{{ editando ? 'Editar' : 'Nuevo' }} Proyecto</h1>

  <form (ngSubmit)="guardar()" class="bg-white rounded-xl p-6 space-y-4">
    <div *ngIf="loading" class="p-4 bg-gray-100/50 border border-gray-300 rounded-lg text-gray-600 text-sm text-center">
      Cargando registro...
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4" *ngIf="!loading">
      <div>
        <label class="block text-sm text-gray-600 mb-1">Documento</label>
        <input [(ngModel)]="dto.numdoc" name="numdoc" maxlength="10"
          class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-sm"
          placeholder="(auto si se deja vacío)" />
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1">Cliente *</label>
        <select [(ngModel)]="dto.idClient" name="idClient" required
          class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-sm">
          <option [ngValue]="undefined">Seleccione...</option>
          <option *ngFor="let c of clientes" [ngValue]="c.idClient">{{ c.name }} ({{ c.rif }})</option>
        </select>
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1">Responsable</label>
        <input [(ngModel)]="dto.responsable" name="responsable" maxlength="100"
          class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-sm" />
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1">Empresa</label>
        <select [(ngModel)]="dto.enterprise" name="enterprise"
          class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-sm">
          <option [ngValue]="0">IEAGER</option>
          <option [ngValue]="1">SIGESP</option>
          <option [ngValue]="2">CHINCHIN</option>
        </select>
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1">Fecha Inicio *</label>
        <input type="date" [(ngModel)]="dto.dateIni" name="dateIni" required
          class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-sm" />
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1">Fecha Fin *</label>
        <input type="date" [(ngModel)]="dto.dateFin" name="dateFin" required
          class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-sm" />
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1">Status</label>
        <select [(ngModel)]="dto.status" name="status"
          class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-sm">
          <option [ngValue]="1">Activo</option>
          <option [ngValue]="0">Inactivo</option>
        </select>
      </div>
    </div>

    <div *ngIf="editando && dto.actividades && dto.actividades.length" class="pt-2">
      <h3 class="text-sm font-semibold text-gray-600 mb-2">Actividades / Horas Plan</h3>
      <div class="max-h-80 overflow-y-auto border border-gray-200 rounded-lg">
        <table class="w-full text-sm">
          <thead class="bg-gray-100 sticky top-0">
            <tr>
              <th class="px-3 py-2 text-left text-gray-600 font-medium">Proceso / Ítem</th>
              <th class="px-3 py-2 text-center text-gray-600 font-medium">Horas Plan</th>
              <th class="px-3 py-2 text-center text-gray-600 font-medium">Horas Ejec</th>
              <th class="px-3 py-2 text-center text-gray-600 font-medium">Activo</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">
            <tr *ngFor="let a of dto.actividades">
              <td class="px-3 py-2 text-gray-600">
                <span class="font-medium text-gray-800">{{ a.name }}</span>
                <span class="text-gray-500"> / {{ a.nameProcess }}</span>
              </td>
              <td class="px-3 py-2 text-center">
                <input type="number" step="0.01" [(ngModel)]="a.hour" name="h{{ a.idEp }}"
                  class="w-24 px-2 py-1 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 text-sm text-right" />
              </td>
              <td class="px-3 py-2 text-center text-blue-700">{{ a.hourE }}</td>
              <td class="px-3 py-2 text-center">
                <input type="checkbox" [(ngModel)]="a.active" name="a{{ a.idEp }}"
                  (change)="a.active = a.active ? 1 : 0" />
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div *ngIf="error" class="p-3 bg-red-100 border border-red-700 rounded-lg text-red-700 text-sm">{{ error }}</div>

    <div class="flex justify-end space-x-3">
      <a routerLink="/sgh/proyectos" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg transition-colors">Cancelar</a>
      <button type="submit" [disabled]="loading"
        class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors disabled:opacity-50">
        {{ loading ? 'Guardando...' : (editando ? 'Actualizar' : 'Crear') }}
      </button>
    </div>
  </form>
</div>
