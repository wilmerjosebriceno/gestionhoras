<div class="max-w-6xl mx-auto p-6">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Logos de Empresa</h1>
    <p class="text-gray-500 text-sm mt-1">
      Estos logos se imprimen en el formato PDF del reporte según la empresa asociada al proyecto
      (SIGESP, IEAGER, CHINCHIN u OTROS).
    </p>
  </div>

  <div *ngIf="error" class="p-3 mb-4 bg-red-100 border border-red-700 rounded-lg text-red-700 text-sm">{{ error }}</div>

  <div *ngIf="loading" class="text-center py-16 text-gray-500">Cargando...</div>

  <div *ngIf="!loading" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    <div *ngFor="let fila of filas" class="bg-white rounded-xl border border-gray-200 p-5 flex flex-col items-center">
      <h2 class="text-lg font-bold text-gray-800 mb-3">{{ fila.empresa }}</h2>
      <div class="h-32 w-full flex items-center justify-center bg-gray-50 border border-gray-200 rounded-lg overflow-hidden mb-3">
        <img *ngIf="fila.dataUri" [src]="fila.dataUri" alt="{{ fila.empresa }}" class="max-h-28 max-w-full object-contain" />
        <span *ngIf="!fila.dataUri" class="text-gray-400 text-sm">Sin logo</span>
      </div>
      <label class="w-full cursor-pointer mb-2">
        <span class="block text-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm transition-colors">
          Elegir imagen (.jpg/.png/.gif)
        </span>
        <input #fileInput type="file" accept=".jpg,.jpeg,.png,.gif" class="hidden" (change)="onSeleccionar(fila, fileInput)" />
      </label>
      <button
        (click)="subir(fila, fileInput)"
        [disabled]="subiendo"
        class="w-full px-4 py-2 bg-green-600 hover:bg-green-700 disabled:opacity-50 text-white rounded-lg text-sm transition-colors"
      >Guardar logo</button>
    </div>
  </div>

  <div class="mt-6 text-xs text-gray-400">
    Nota: si una empresa no tiene un logo subido, el sistema usará el logo de respaldo en el reporte.
  </div>
</div>
